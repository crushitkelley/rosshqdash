    var b = new Date(todayISO() + "T00:00:00");
    return Math.round((a - b) / 86400000);
  }

  function priorityScore(p) {
    if (!p.deadline || !p.tier) return -Infinity;
    var dl = daysLeft(p.deadline);
    var urgency = dl <= 0 ? 1000 + (0 - dl) * 10 : 1000 / (dl + 1);
    var bonus = p.tier === "T1" ? 50 : p.tier === "T2" ? 25 : 0;
    return urgency + bonus;
  }

  function remainingItems(p) { return Math.max(0, (p.items || 0) - (p.graded || 0)); }

  function sortedProjects() {
    return data.projects.slice().sort(function (a, b) { return priorityScore(b) - priorityScore(a); });
  }

  function globalRankMap() {
    var map = {};
    sortedProjects().forEach(function (p, i) { map[p.id] = i + 1; });
    return map;
  }

  function nextMove(tier) {
    if (tier === "T1") return "Deep pass, 6 min/item — Wed A or Thu A sprint";
    if (tier === "T2") return "Coded pass, 3 min/item — any B sprint";
    if (tier === "T3") return "Score-only, 90 sec/item — batch in a bulk sprint";
    return "";
  }

  function itemsPerSprint(tier, len) {
    var mpi = TIER_MIN[tier];
    return Math.floor((len - 5) / (mpi + 0.2));
  }

  function uid() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  var DAY_OFFSET = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4 };
  var WEEKDAY_NAME_BY_NUM = { 1: "Mon", 2: "Tue", 3: "Wed", 4: "Thu", 5: "Fri" };

  function addDays(iso, n) {
    var d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + n);
    return toISO(d);
  }

  function dateForDayPlan(weekStart, dayName) {
    if (!weekStart || !(dayName in DAY_OFFSET)) return null;
    return addDays(weekStart, DAY_OFFSET[dayName]);
  }

  // date ISO -> array of {course, weekIdx, dayIdx, title, day}
  function buildLessonDateIndex() {
    var idx = {};
    COURSES.forEach(function (course) {
      (data.lessons[course] || []).forEach(function (week, wi) {
        (week.days || []).forEach(function (d, di) {
          var dt = dateForDayPlan(week.weekStart, d.day);
          if (!dt) return;
          idx[dt] = idx[dt] || [];
          idx[dt].push({ course: course, weekIdx: wi, dayIdx: di, title: d.title, day: d.day });
        });
      });
    });
    return idx;
  }

  function jumpToLesson(course, weekIdx) {
    ui.tab = "lessons"; ui.course = course; ui.weekIdx = weekIdx;
    render();
  }

  // ---------- scheduling ----------
  function generateSlots(startISO, count) {
    var slots = [];
    var d = new Date(startISO + "T00:00:00");
    while (slots.length < count) {
      var dow = d.getDay();
      var def = WEEKDAY_SLOTS[dow];
      if (def) {
        slots.push({
          date: toISO(d),
          dayName: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][dow],
          label: def.label, len: def.len
        });
      }
      d.setDate(d.getDate() + 1);
    }
    return slots;
  }

  function buildSchedule() {
    var queue = sortedProjects().filter(function (p) { return p.status !== "Done" && remainingItems(p) > 0; });
    var remaining = {};
    queue.forEach(function (p) { remaining[p.id] = remainingItems(p); });
    var slots = generateSlots(todayISO(), SCHEDULE_HORIZON_DAYS);
    var schedule = [];
    var qi = 0;
    for (var s = 0; s < slots.length && qi < queue.length; s++) {
      var slot = slots[s];
      var avail = slot.len - 5; // gradebook-entry buffer
      var entries = [];
      while (avail > 0 && qi < queue.length) {
        var p = queue[qi];
        var rem = remaining[p.id];
        if (rem <= 0) { qi++; continue; }
        var mpi = TIER_MIN[p.tier];
        var maxItems = Math.floor(avail / mpi);
        if (maxItems <= 0) break;
        var itemsThis = Math.min(rem, maxItems);
        entries.push({ projectId: p.id, name: p.name, course: p.course, tier: p.tier, items: itemsThis, minutes: Math.round(itemsThis * mpi) });
        remaining[p.id] -= itemsThis;
        avail -= itemsThis * mpi;
        if (remaining[p.id] <= 0) qi++;
      }
      if (entries.length) schedule.push({ date: slot.date, dayName: slot.dayName, label: slot.label, entries: entries });
    }
    var unscheduled = queue.filter(function (p) { return remaining[p.id] > 0; }).map(function (p) { return p.name; });
    return { schedule: schedule, unscheduled: unscheduled };
  }

  function chunksForProject(schedule, projectId) {
    var out = [];
    schedule.forEach(function (slot) {
      slot.entries.forEach(function (e) {
        if (e.projectId === projectId) out.push({ date: slot.date, dayName: slot.dayName, label: slot.label, items: e.items, minutes: e.minutes });
      });
    });
    return out;
  }

  function markChunkDone(projectId, items) {
    var p = data.projects.filter(function (x) { return x.id === projectId; })[0];
    if (!p) return;
    p.graded = Math.max(0, Math.min(p.items, (p.graded || 0) + items));
    if (p.graded >= p.items && p.items > 0) p.status = "Done";
    else if (p.graded > 0 && p.status === "Not Started") p.status = "In Progress";
    scheduleSave();
    render();
  }

  // ---------- persistence ----------
  function scheduleSave() {
    saveState = "saving";
    renderSaveIndicator();
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 500);
    try { localStorage.setItem("gradingLessonPlannerData", JSON.stringify(data)); } catch (e) {}
  }

  function doSave() {
    if (!artifactHandle) { saveState = "offline"; renderSaveIndicator(); return; }
    var html = buildDoc(data);
    artifactHandle.publish(html).then(function () {
      saveState = "saved";
      renderSaveIndicator();
    }).catch(function () {
      saveState = "offline";
      renderSaveIndicator();
    });
  }

  function buildDoc(d) {
    var jsonStr = JSON.stringify(d).replace(/<\//g, "<" + "\\/");
    var srcStr = App.toString();
    var openTag = "<" + "script>";
    var closeTag = "<" + "/script>";
    return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n" +
      "<title>" + TITLE + "</title>\n</head>\n<body>\n<div id=\"root\"></div>\n" +

  }

  function renderSaveIndicator() {
    var elx = document.getElementById("save-indicator");
    if (!elx) return;
    var map = {
      idle: ["idle", "Not yet saved"],
      saving: ["saving", "Saving…"],
      saved: ["saved", "Saved"],
      offline: ["offline", "Saved on this device only"]
    };
    var m = map[saveState] || map.idle;
    elx.className = "save-indicator " + m[0];
    elx.textContent = m[1];
  }

  // ---------- rendering ----------
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  var DEFAULT_VARS = {
    paper: "#F6EFDD", card: "#FFFBF2", card2: "#FBF2DF", line: "#E4D2A6",
    ink: "#3A2C1E", "ink-soft": "#8A7A5E", gold: "#C1872A", "gold-deep": "#8F5F16",
    forest: "#4B6B4E", "forest-deep": "#385238", brick: "#B04D33",
    glass: "rgba(255,255,255,.55)", "glass-border": "rgba(255,255,255,.6)",

    "font-body": "'Karla',-apple-system,Segoe UI,Roboto,sans-serif",
    "bg-image": "radial-gradient(circle at 12% 15%,rgba(193,135,42,.40),transparent 42%),radial-gradient(circle at 88% 12%,rgba(75,107,78,.32),transparent 45%),radial-gradient(circle at 75% 85%,rgba(176,77,51,.28),transparent 48%),radial-gradient(circle at 15% 90%,rgba(193,135,42,.22),transparent 45%)"
  };

  function applyTheme() {
    var theme = THEMES[data.theme] || THEMES.harvest;
    var root = document.documentElement;
    var merged = {};
    Object.keys(DEFAULT_VARS).forEach(function (k) { merged[k] = DEFAULT_VARS[k]; });
    Object.keys(theme.vars).forEach(function (k) { merged[k] = theme.vars[k]; });
    Object.keys(merged).forEach(function (k) {
      root.style.setProperty("--" + k, merged[k]);
    });
  }

  function render() {
    injectStyle();
    applyTheme();
    var root = document.getElementById("root");
    root.innerHTML = "";
    var wrap = el("div", { class: "wrap" });
    var theme = THEMES[data.theme] || THEMES.harvest;
    var isCreative = !!theme.headerType;

    var topbar = isCreative ? renderCreativeHeader(theme.headerType) : renderHeader();
    wrap.appendChild(topbar);

    if (!isCreative) {
      var picker = el("div", { class: "header-style-picker" });
      HEADER_STYLES.forEach(function (hs) {
        picker.appendChild(el("button", {
          class: "header-style-btn" + (data.headerStyle === hs[0] ? " active" : ""), text: hs[1],
          onclick: function () { data.headerStyle = hs[0]; scheduleSave(); render(); }
        }));
      });
      wrap.appendChild(picker);
    }

    var themePicker = el("div", { class: "theme-picker" });
    Object.keys(THEMES).forEach(function (key) {
      var t = THEMES[key];
      var swatch = el("span", { class: "theme-swatch" }, t.swatch.map(function (c) {
        return el("span", { class: "theme-swatch-dot", style: "background:" + c });
      }));
      themePicker.appendChild(el("button", {
        class: "theme-btn" + (data.theme === key ? " active" : ""),
        onclick: function () { data.theme = key; scheduleSave(); render(); }
      }, [swatch, el("span", { text: t.label })]));
    });
    wrap.appendChild(themePicker);

    var defaultIcons = { home: "🏠", grading: "🗂️", schedule: "🗓️", calendar: "📅", lessons: "📖", resources: "🔗" };
    var icons = theme.icons || defaultIcons;
    var TILE_COLORS = ["#5B8DEF", "#4FBF8B", "#FF9F7B", "#B79CED", "#FFC857", "#7BC9E8"];
    var tabDefs = [
      ["home", icons.home || defaultIcons.home, "Home"],
      ["grading", icons.grading, "Grading"],
      ["schedule", icons.schedule, "Schedule"],
      ["calendar", icons.calendar, "Calendar"],
      ["lessons", icons.lessons, "Lesson Planner"],
      ["resources", icons.resources, "Resources"]
    ];

    function currentTabContent() {
      if (ui.tab === "home") return renderHome();
      if (ui.tab === "grading") return renderGrading();
      if (ui.tab === "schedule") return renderSchedule();
      if (ui.tab === "calendar") return renderCalendar();
      if (ui.tab === "lessons") return renderLessons();
      return renderResourcesDashboard();
    }

    if (isCreative && theme.layout === "top-pills") {
      var pillNav = el("div", { class: "pill-nav" }, tabDefs.map(function (t) {
        return el("button", {
          class: "pill-nav-btn" + (ui.tab === t[0] ? " active" : ""), text: t[1] + " " + t[2],
          onclick: function () { ui.tab = t[0]; render(); }
        });
      }));
      wrap.appendChild(pillNav);
      wrap.appendChild(currentTabContent());
    } else if (isCreative && theme.layout === "top-tiles") {
      var tileNav = el("div", { class: "tile-nav" }, tabDefs.map(function (t, idx) {
        return el("button", {
          class: "tile-btn" + (ui.tab === t[0] ? " active" : ""),
          style: "background:" + TILE_COLORS[idx % TILE_COLORS.length],
          onclick: function () { ui.tab = t[0]; render(); }
        }, [
          el("span", { class: "tile-icon", text: t[1] }),
          el("span", { class: "tile-label", text: t[2] })
        ]);
      }));
      wrap.appendChild(tileNav);
      wrap.appendChild(currentTabContent());
    } else if (isCreative) {
      var shell = el("div", { class: "app-shell design-" + data.theme });
      var sideNav = el("div", { class: "side-nav nav-" + (theme.layout === "side-right" ? "right" : "left") });
      tabDefs.forEach(function (t) {
        sideNav.appendChild(el("button", {
          class: "side-nav-btn" + (ui.tab === t[0] ? " active" : ""), text: t[1] + " " + t[2],
          onclick: function () { ui.tab = t[0]; render(); }
        }));
      });
      var mainContent = el("div", { class: "main-content" });
      mainContent.appendChild(currentTabContent());
      if (theme.layout === "side-right") {
        shell.appendChild(mainContent);
        shell.appendChild(sideNav);
      } else {
        shell.appendChild(sideNav);
        shell.appendChild(mainContent);
      }
      wrap.appendChild(shell);
    } else {
      var tabs = el("div", { class: "tabs" }, tabDefs.map(function (t) {
        return el("button", {
          class: "tab-btn" + (ui.tab === t[0] ? " active" : ""), text: t[1] + " " + t[2],
          onclick: function () { ui.tab = t[0]; render(); }
        });
      }));
      wrap.appendChild(tabs);
      wrap.appendChild(currentTabContent());
    }

    root.appendChild(wrap);
    renderSaveIndicator();
  }

  function renderHome() {
    var frag = el("div", {});

    // Today panel: classes + events
    var panel1 = el("div", { class: "panel" });
    panel1.appendChild(el("h2", {
      text: "🏠 Today — " + todayDateObj.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })
    }));

    if (classesToday.length) {
      var lessonIdx = buildLessonDateIndex();
      var classList = el("div", { class: "cal-class-list" });
      classesToday.forEach(function (course) {
        var match = (lessonIdx[todayStr] || []).filter(function (l) { return l.course === course; })[0];
        var row = el("div", { class: "cal-class-row" });
        row.appendChild(courseBadge(course));
        if (match) {
          row.appendChild(el("button", {
            class: "btn small secondary", text: "📖 " + (match.title || "(untitled lesson)"),
            onclick: function (m) { return function () { jumpToLesson(m.course, m.weekIdx); }; }(match)
          }));

        }
        classList.appendChild(row);
      });
      panel1.appendChild(classList);
    } else {
      panel1.appendChild(el("div", { class: "empty", text: "No classes marked for today yet — set them on the Calendar tab." }));
    }
    var todaysEvents = data.events.filter(function (e) { return e.date === todayStr; });
    if (todaysEvents.length) {
      panel1.appendChild(el("h3", { text: "Events today", style: "margin-top:14px;" }));
      var evList = el("ul", { class: "resource-list" });

  // ---------- GRADING TAB ----------

    } else {

        if (!list.length) return;
        var totalMin = list.reduce(function (s, p) { return s + remainingItems(p) * TIER_MIN[p.tier]; }, 0);
        var totalItemsAll = list.reduce(function (s, p) { return s + (p.items || 0); }, 0);
        var gradedItemsAll = list.reduce(function (s, p) { return s + Math.min(p.items || 0, p.graded || 0); }, 0);
        var group = el("div", { class: "class-group" });

        var tbody = el("tbody");

          var gradedInput = el("input", {
            type: "number", class: "graded-input", min: "0", max: String(p.items)
          });
          gradedInput.value = String(p.graded || 0);
          gradedInput.addEventListener("change", function (e) {
            var v = Math.max(0, Math.min(p.items, Number(e.target.value) || 0));
            p.graded = v;
            if (v >= p.items && p.items > 0) p.status = "Done";
            else if (v > 0 && p.status === "Not Started") p.status = "In Progress";
            scheduleSave(); render();
          });
          var gradedWrap = el("span", {}, [gradedInput, el("span", { text: " / " + p.items })]);
          var statusSel = el("select", {
            onchange: function (e) { p.status = e.target.value; scheduleSave(); render(); }
          }, ["Not Started", "In Progress", "Done"].map(function (s) {

            return o;
          }));
          var delBtn = el("button", {
            class: "btn danger", text: "Remove", onclick: function () {
              data.projects = data.projects.filter(function (x) { return x.id !== p.id; });
              scheduleSave(); render();
            }
          });
          var row = el("tr", { class: overdueRow ? "overdue" : "" }, [
            tdWrap("Rank", el("span", { class: "rank", text: String(rankMap[p.id] || "—") })),
            tdWrap("Assignment", el("span", { text: p.name })),
            tdWrap("Tier", el("span", { text: TIER_LABEL[p.tier] || p.tier })),
            tdWrap("Graded / Items", gradedWrap),
            tdWrap("Deadline", el("span", { text: p.deadline })),
            tdWrap("Days left", el("span", { class: "days-left " + dlClass, text: dl === null ? "—" : String(dl) })),
            tdWrap("Status", statusSel),
            tdWrap("Next move", el("span", { text: nextMove(p.tier) })),
            tdWrap("", delBtn)
          ]);
          tbody.appendChild(row);
        });
        table.appendChild(tbody);
        group.appendChild(table);
        listPanel.appendChild(group);
      });
    }
    frag.appendChild(listPanel);

    return frag;
  }

  function statCard(n, label, isOverdue, icon) {
    var kids = [];
    if (icon) kids.push(el("span", { class: "icon", text: icon }));
    kids.push(el("div", { class: "num", text: String(n) }));
    kids.push(el("div", { class: "lbl", text: label }));
    return el("div", { class: "stat" + (isOverdue ? " overdue" : "") }, kids);
  }

  function progressBar(pct) {
    var track = el("div", { class: "class-progress" });
    var fill = el("div", { class: "class-progress-fill" });
    fill.style.width = Math.round(Math.max(0, Math.min(1, pct)) * 100) + "%";
    track.appendChild(fill);
    return track;
  }

  function tdWrap(label, child) {
    var td = el("td", { "data-label": label });
    td.appendChild(child);
    return td;
  }

  function courseBadge(course) {
    return el("span", { class: "badge", style: "background:" + (COURSE_COLOR[course] || "#666"), text: course });
  }

  function fieldInput(type, placeholder) {
    var attrs = { type: type };
    if (placeholder) attrs.placeholder = placeholder;
    return el("input", attrs);
  }

  function fieldSelect(options) {
    return el("select", {}, options.map(function (o) { return el("option", { value: o, text: o }); }));
  }

  // ---------- SCHEDULE TAB ----------
  function renderSchedule() {
    var frag = el("div", {});
    var result = buildSchedule();
    var schedule = result.schedule;
    var unscheduled = result.unscheduled;

    if (!data.projects.length) {
      frag.appendChild(el("div", { class: "panel" }, [
        el("div", { class: "empty", text: "Add assignments on the Grading tab and your schedule will build itself here." })
      ]));

    }

    if (unscheduled.length) {
      var warnPanel = el("div", { class: "panel" });
      warnPanel.appendChild(el("div", {
        class: "warn",
        text: "These don't fit in the next " + SCHEDULE_HORIZON_DAYS + " weekdays at your current pace: " + unscheduled.join(", ")
      }));
      frag.appendChild(warnPanel);
    }

    // Today's Sprint — quick mark-done panel
    var todaySlot = null;
    schedule.forEach(function (slot) { if (slot.date === todayISO() && !todaySlot) todaySlot = slot; });
    var todayPanel = el("div", { class: "panel today-panel" });
    if (todaySlot) {
      todayPanel.appendChild(el("h2", { text: "📌 Today's Sprint — " + todaySlot.dayName + " " + todaySlot.date + " · " + todaySlot.label }));
      var todayList = el("div", { class: "today-entries" });
      todaySlot.entries.forEach(function (e) {
        var row = el("div", { class: "today-entry" }, [
          el("span", { class: "badge", style: "background:" + (COURSE_COLOR[e.course] || "#666"), text: e.course }),
          el("span", { class: "today-entry-text", text: e.name + " — " + e.items + " items (~" + e.minutes + " min)" }),
          el("button", {
            class: "btn small", text: "✓ Mark graded",

          })
        ]);
        todayList.appendChild(row);
      });
      todayPanel.appendChild(todayList);
    } else {

      todayPanel.appendChild(el("h2", { text: "📌 Today's Sprint" }));
      if (nextSlot) {
        todayPanel.appendChild(el("div", {
          class: "empty",
          text: "Nothing scheduled today. Next up: " + nextSlot.dayName + " " + nextSlot.date + " · " + nextSlot.label
        }));
      } else {
        todayPanel.appendChild(el("div", { class: "empty", text: "Nothing scheduled — you're caught up." }));
      }
    }
    frag.appendChild(todayPanel);

    // By-class breakdown with step chunks
    var panelA = el("div", { class: "panel" });
    panelA.appendChild(el("h2", { text: "🧩 Breakdown of steps, by class" }));
    var active = data.projects.filter(function (p) { return p.status !== "Done" && remainingItems(p) > 0; });
    if (!active.length) {
      panelA.appendChild(el("div", { class: "empty", text: "Everything is graded — nothing left to schedule." }));
    } else {
      var rankMap = globalRankMap();
      COURSES.forEach(function (course) {
        var list = active.filter(function (p) { return p.course === course; })
          .sort(function (a, b) { return priorityScore(b) - priorityScore(a); });
        if (!list.length) return;
        var group = el("div", { class: "class-group" });
        group.appendChild(el("div", { class: "class-group-head" }, [
          el("span", { class: "dot", style: "background:" + COURSE_COLOR[course] }),
          el("h3", { text: course })
        ]));
        list.forEach(function (p) {
          var chunks = chunksForProject(schedule, p.id);
          var rem = remainingItems(p);
          var totalMin = Math.round(rem * TIER_MIN[p.tier]);
          var card = el("div", { class: "project-card" });
          var lastChunkDate = chunks.length ? chunks[chunks.length - 1].date : null;
          var missesDeadline = lastChunkDate && p.deadline && lastChunkDate > p.deadline;
          card.appendChild(el("div", { class: "project-card-head" }, [
            el("div", {}, [
              el("div", { class: "pname", text: "#" + (rankMap[p.id] || "—") + " · " + p.name }),
              el("div", {
                class: "sub", text: TIER_LABEL[p.tier] + " · " + rem + " item" + (rem === 1 ? "" : "s") + " left · ~" + totalMin + " min · due " + p.deadline
              })
            ])
          ]));
          if (chunks.length) {
            var ul = el("ul", { class: "chunk-list" }, chunks.map(function (c, i) {
              return el("li", { text: "Step " + (i + 1) + ": " + c.dayName + " " + c.date + " — " + c.label + " — " + c.items + " items (~" + c.minutes + " min)" });
            }));
            card.appendChild(ul);
          } else {
            card.appendChild(el("div", { class: "warn", text: "Not scheduled within the lookahead window." }));
          }
          if (missesDeadline) {
            card.appendChild(el("div", { class: "warn", text: "At current pace this finishes after its " + p.deadline + " deadline." }));
          }

      var tbody = el("tbody");
      schedule.forEach(function (slot) {
        var isToday = slot.date === todayISO();
        var entriesCell = el("div", { class: "sched-entries" });
        slot.entries.forEach(function (e) {
          entriesCell.appendChild(el("div", { class: "sched-entry-row" }, [
            el("span", { text: e.course + " — " + e.name + ": " + e.items + " items (~" + e.minutes + " min)" }),
            el("button", {
              class: "btn small secondary", text: "✓ Done",
              onclick: function () { markChunkDone(e.projectId, e.items); }
            })
          ]));
        });
        tbody.appendChild(el("tr", { class: isToday ? "today-row" : "" }, [
          tdWrap("Date", el("span", { text: slot.date })),
          tdWrap("Day", el("span", { text: slot.dayName })),
          tdWrap("Sprint", el("span", { text: slot.label })),
          tdWrap("What to grade", entriesCell)

      }))));

    return frag;

  // ---------- CALENDAR TAB ----------
  function renderCalendar() {
    var frag = el("div", {});

    // Month grid

    var monthLabel = new Date(ui.calYear, ui.calMonth, 1).toLocaleString("en-US", { month: "long", year: "numeric" });
    nav.appendChild(el("button", {
      class: "btn secondary small", text: "← Prev", onclick: function () {
        ui.calMonth--; if (ui.calMonth < 0) { ui.calMonth = 11; ui.calYear--; } render();
      }
    }));
    nav.appendChild(el("h2", { text: monthLabel, style: "flex:1;text-align:center;" }));

      class: "btn secondary small", text: "Next →", onclick: function () {
        ui.calMonth++; if (ui.calMonth > 11) { ui.calMonth = 0; ui.calYear++; } render();
      }
    }));
    calPanel.appendChild(nav);

    var lessonIdx = buildLessonDateIndex();
    var grid = el("div", { class: "cal-grid" });
    ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach(function (dn) {
      grid.appendChild(el("div", { class: "cal-dow", text: dn }));
    });
    var first = new Date(ui.calYear, ui.calMonth, 1);
    var startOffset = first.getDay();
    var daysInMonth = new Date(ui.calYear, ui.calMonth + 1, 0).getDate();
    for (var i = 0; i < startOffset; i++) grid.appendChild(el("div", { class: "cal-cell empty-cell" }));
    var todayStr = todayISO();
    var _loop = function (day) {
      var dateObj = new Date(ui.calYear, ui.calMonth, day);
      var iso = toISO(dateObj);
      var cls = "cal-cell";
      if (iso === todayStr) cls += " cal-today";
      if (ui.calSelected === iso) cls += " cal-selected";
      var cell = el("div", { class: cls });
      cell.appendChild(el("div", { class: "cal-daynum", text: String(day) }));
      var todaysClasses = data.classDays[iso] || [];
      if (todaysClasses.length) {
        var dots = el("div", { class: "cal-dots" });
        todaysClasses.forEach(function (course) {
          dots.appendChild(el("span", { class: "cal-dot", style: "background:" + COURSE_COLOR[course] }));
        });
        cell.appendChild(dots);
      }
      (lessonIdx[iso] || []).forEach(function (l) {
        var chip = el("span", {
          class: "cal-chip", style: "border-left-color:" + COURSE_COLOR[l.course],
          text: l.course + (l.title ? (": " + l.title) : "")
        });
        chip.addEventListener("click", function (e) { e.stopPropagation(); jumpToLesson(l.course, l.weekIdx); });
        cell.appendChild(chip);
      });
      data.events.filter(function (ev) { return ev.date === iso; }).forEach(function (ev) {
        cell.appendChild(el("span", { class: "cal-event-chip", text: (ev.time ? ev.time + " " : "") + ev.title }));
      });
      cell.addEventListener("click", function () { ui.calSelected = iso; ui.addingEvent = false; render(); });
      grid.appendChild(cell);
    };
    for (var day = 1; day <= daysInMonth; day++) _loop(day);
    calPanel.appendChild(grid);
    frag.appendChild(calPanel);

    // Selected-day detail
    if (ui.calSelected) {
      var detail = el("div", { class: "panel" });
      var selDate = new Date(ui.calSelected + "T00:00:00");
      detail.appendChild(el("h2", {
        text: "🗒️ " + selDate.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })
      }));

      detail.appendChild(el("h3", { text: "Which classes meet today?", style: "margin-top:0;" }));
      var checklist = el("div", { class: "cal-class-list" });
      var selClasses = data.classDays[ui.calSelected] || [];
      COURSES.forEach(function (course) {
        var checked = selClasses.indexOf(course) !== -1;
        var cb = el("input", { type: "checkbox" });
        cb.checked = checked;
        cb.addEventListener("change", function (e) {
          var list = (data.classDays[ui.calSelected] || []).slice();
          if (e.target.checked) {
            if (list.indexOf(course) === -1) list.push(course);
          } else {
            list = list.filter(function (c) { return c !== course; });
          }
          data.classDays[ui.calSelected] = list;
          scheduleSave(); render();
        });
        var row = el("div", { class: "cal-class-row" });
        row.appendChild(cb);
        row.appendChild(courseBadge(course));
        if (checked) {
          var match = (lessonIdx[ui.calSelected] || []).filter(function (l) { return l.course === course; })[0];
          if (match) {
            row.appendChild(el("button", {
              class: "btn small secondary", text: "📖 " + (match.title || "(untitled lesson)"),
              onclick: function (m) { return function () { jumpToLesson(m.course, m.weekIdx); }; }(match)
            }));
          } else {
            row.appendChild(el("span", { class: "cal-no-lesson", text: "No lesson plan linked yet" }));
            row.appendChild(el("button", {
              class: "btn small secondary", text: "+ Plan this lesson",
              onclick: function (c) { return function () { goPlanLesson(c, ui.calSelected); }; }(course)
            }));
          }
        }
        checklist.appendChild(row);
      });
      detail.appendChild(checklist);

      detail.appendChild(el("h3", { text: "Events", style: "margin-top:16px;" }));
      var evList = el("ul", { class: "resource-list" });
      var todaysEvents = data.events.filter(function (e) { return e.date === ui.calSelected; });
      if (!todaysEvents.length) evList.appendChild(el("li", { class: "resource-empty", text: "No events yet." }));
      todaysEvents.forEach(function (ev) {
        var li = el("li", { class: "resource-row" });
        li.appendChild(el("span", { class: "resource-link", text: (ev.time ? ev.time + " — " : "") + ev.title }));
        li.appendChild(el("button", {
          class: "btn danger", text: "✕", onclick: function () {
            data.events = data.events.filter(function (x) { return x.id !== ev.id; });
            scheduleSave(); render();
          }
        }));
        evList.appendChild(li);
      });
      detail.appendChild(evList);

      if (ui.addingEvent) {
        var evTitleI = el("input", { type: "text", placeholder: "Event title" });
        var evTimeI = el("input", { type: "time" });
        var evAddBtn = el("button", {
          class: "btn small", text: "✓ Add", onclick: function () {
            if (!evTitleI.value.trim()) return;
            data.events.push({ id: uid(), date: ui.calSelected, title: evTitleI.value.trim(), time: evTimeI.value || "" });
            ui.addingEvent = false; scheduleSave(); render();
          }
        });
        var evCancelBtn = el("button", {
          class: "btn small secondary", text: "Cancel", onclick: function () { ui.addingEvent = false; render(); }
        });
        detail.appendChild(el("div", { class: "resource-add-row" }, [evTitleI, evTimeI, el("div", { style: "display:flex;gap:6px;" }, [evAddBtn, evCancelBtn])]));
      } else {
        detail.appendChild(el("button", { class: "btn secondary small", text: "+ Add event", onclick: function () { ui.addingEvent = true; render(); } }));
      }

      frag.appendChild(detail);
    }

    return frag;
  }

  function goPlanLesson(course, dateISO) {
    var d = new Date(dateISO + "T00:00:00");
    var dayName = WEEKDAY_NAME_BY_NUM[d.getDay()];
    if (!dayName) return;
    var monday = addDays(dateISO, -(DAY_OFFSET[dayName]));
    var weeks = data.lessons[course];
    var wi = -1;
    weeks.forEach(function (w, i) { if (w.weekStart === monday) wi = i; });
    if (wi === -1) {
      weeks.push({ weekStart: monday, days: [] });
      wi = weeks.length - 1;
    }
    var week = weeks[wi];
    var existing = week.days.filter(function (dd) { return dd.day === dayName; })[0];
    if (!existing) {
      week.days.push({ day: dayName, title: "", objectives: "", warmup: "", miniLesson: "", classPlan: "", closing: "", homework: "", otherNotes: "", resources: [] });
    }
    scheduleSave();
    jumpToLesson(course, wi);
  }

  // ---------- RESOURCES DASHBOARD TAB ----------
  function renderResourcesDashboard() {
    var frag = el("div", {});

    var panel1 = el("div", { class: "panel" });
    panel1.appendChild(el("h2", { text: "✚ Add a resource link" }));
    var form = el("form", { class: "add-form" });
    var labelI = fieldInput("text", "Label (e.g. Canvas, Gradebook)");
    var urlI = fieldInput("text", "URL");
    var catI = fieldInput("text", "Category (optional)");
    var addBtn = el("button", { class: "btn", type: "submit", text: "+ Add" });
    [["Label", labelI], ["URL", urlI], ["Category", catI]].forEach(function (pair) {
      form.appendChild(el("div", {}, [el("label", { text: pair[0] }), pair[1]]));
    });
    form.appendChild(el("div", {}, [el("label", { text: "\u00A0" }), addBtn]));
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!labelI.value.trim() || !urlI.value.trim()) return;
      var url = urlI.value.trim();
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;
      data.dashboardLinks.push({ id: uid(), label: labelI.value.trim(), url: url, category: catI.value.trim() || "General" });
      scheduleSave(); render();
    });
    panel1.appendChild(form);
    frag.appendChild(panel1);

    var panel2 = el("div", { class: "panel" });
    panel2.appendChild(el("h2", { text: "🔗 Your links" }));
    if (!data.dashboardLinks.length) {
      panel2.appendChild(el("div", { class: "empty", text: "No links yet — add your first one above." }));
    } else {
      var byCat = {};
      data.dashboardLinks.forEach(function (l) {
        var cat = l.category || "General";
        (byCat[cat] = byCat[cat] || []).push(l);
      });
      Object.keys(byCat).sort().forEach(function (cat) {
        panel2.appendChild(el("h3", { text: cat, style: "margin-top:14px;" }));
        var tileGrid = el("div", { class: "link-tile-grid" });
        byCat[cat].forEach(function (l) {
          var tile = el("div", { class: "link-tile" });
          tile.appendChild(el("a", { href: l.url, target: "_blank", rel: "noopener noreferrer", class: "link-tile-anchor", text: l.label }));
          tile.appendChild(el("button", {
            class: "btn danger", text: "✕", onclick: function () {
              data.dashboardLinks = data.dashboardLinks.filter(function (x) { return x.id !== l.id; });
              scheduleSave(); render();
            }
          }));
          tileGrid.appendChild(tile);
        });
        panel2.appendChild(tileGrid);
      });
    }
    frag.appendChild(panel2);

    return frag;
  }

  // ---------- LESSON PLANNER TAB ----------
  function renderLessons() {
    var frag = el("div", {});
    var courseTabs = el("div", { class: "course-tabs" }, COURSES.map(function (c) {
      var active = ui.course === c;
      var btn = el("button", {
        class: "course-tab", text: c,
        onclick: function () { ui.course = c; ui.weekIdx = 0; render(); }
      });
      btn.style.borderColor = active ? COURSE_COLOR[c] : "transparent";
      btn.style.background = active ? COURSE_COLOR[c] : "var(--panel2)";
      btn.style.color = active ? "#0b1420" : "var(--text)";
      return btn;
    }));
    frag.appendChild(courseTabs);

    var course = ui.course;
    var panel = el("div", { class: "panel" });

    var unitRow = el("div", { class: "unit-row" }, [
      el("div", {}, [
        el("label", { text: "Current unit" }),
        el("input", {
          type: "text", value: data.units[course].unit,
          oninput: function (e) { data.units[course].unit = e.target.value; scheduleSave(); }
        })
      ]),
      el("div", {}, [
        el("label", { text: "Focus skill" }),
        el("input", {
          type: "text", value: data.units[course].focusSkill,
          oninput: function (e) { data.units[course].focusSkill = e.target.value; scheduleSave(); }
        })
      ])
    ]);
    panel.appendChild(unitRow);

    var weeks = data.lessons[course];
    if (ui.weekIdx >= weeks.length) ui.weekIdx = Math.max(0, weeks.length - 1);

    var weekHeader = el("div", { class: "week-header" });
    var weekSelect = el("div", { class: "week-select" });
    weekSelect.appendChild(el("label", { text: "Week: ", style: "margin:0;" }));
    var sel = el("select", {
      onchange: function (e) { ui.weekIdx = Number(e.target.value); render(); }
    }, weeks.map(function (w, i) {
      var o = el("option", { value: String(i), text: w.weekStart || ("Week " + (i + 1)) });
      if (i === ui.weekIdx) o.setAttribute("selected", "selected");
      return o;
    }));
    weekSelect.appendChild(sel);
    weekHeader.appendChild(weekSelect);

    if (ui.addingWeek) {
      var newWeekInput = el("input", { type: "date", value: todayISO() });
      var confirmBtn = el("button", {
        class: "btn small", text: "✓ Add", onclick: function () {
          var ws = newWeekInput.value || todayISO();
          weeks.push({ weekStart: ws, days: [] });
          ui.weekIdx = weeks.length - 1;
          ui.addingWeek = false;
          scheduleSave(); render();
        }
      });
      var cancelBtn = el("button", {
        class: "btn small secondary", text: "Cancel", onclick: function () { ui.addingWeek = false; render(); }
      });
      weekHeader.appendChild(el("div", { style: "display:flex;gap:6px;align-items:center;" }, [newWeekInput, confirmBtn, cancelBtn]));
    } else {
      var newWeekBtn = el("button", {
        class: "btn secondary", text: "+ New week", onclick: function () { ui.addingWeek = true; render(); }
      });
      weekHeader.appendChild(newWeekBtn);
    }
    panel.appendChild(weekHeader);

    if (!weeks.length) {
      panel.appendChild(el("div", { class: "empty", text: "No weeks planned yet for " + course + " — add one above." }));
    } else {
      var week = weeks[ui.weekIdx];
      week.days = week.days || [];
      var addDayBtn = el("button", {
        class: "btn", text: "+ Add day", style: "margin-bottom:12px;", onclick: function () {
          week.days.push({ day: "Mon", title: "", objectives: "", warmup: "", miniLesson: "", classPlan: "", closing: "", homework: "", otherNotes: "", resources: [] });
          scheduleSave(); render();
        }
      });
      panel.appendChild(addDayBtn);

      var grid = el("div", { class: "day-grid" });
      if (!week.days.length) {
        grid.appendChild(el("div", { class: "empty", text: "No days added to this week yet." }));
      }
      week.days.forEach(function (d, di) {
        var card = el("div", { class: "day-card" });
        var daySel = el("select", {
          onchange: function (e) { d.day = e.target.value; scheduleSave(); }
        }, ["Mon", "Tue", "Wed", "Thu", "Fri"].map(function (dn) {
          var o = el("option", { value: dn, text: dn });
          if (dn === d.day) o.setAttribute("selected", "selected");
          return o;
        }));
        var delDayBtn = el("button", {
          class: "btn danger", text: "Remove", onclick: function () {
            week.days.splice(di, 1); scheduleSave(); render();
          }
        });
        card.appendChild(el("div", { class: "day-card-head" }, [daySel, delDayBtn]));

        var titleI = el("input", {
          type: "text", class: "lesson-title-input", placeholder: "Lesson title (e.g. Act I, Scene 1)",
          oninput: function (e) { d.title = e.target.value; scheduleSave(); }
        });
        titleI.value = d.title || "";
        card.appendChild(el("div", { class: "field" }, [titleI]));

        var objTa = el("textarea", {
          class: "objectives-input",
          oninput: function (e) { d.objectives = e.target.value; scheduleSave(); }
        });
        objTa.value = d.objectives || "";
        card.appendChild(el("div", { class: "field objectives-box" }, [
          el("label", { text: "🎯 Goals / Objectives" }), objTa
        ]));

        DAY_FIELDS.forEach(function (pair) {
          var key = pair[0], label = pair[1];
          var ta = el("textarea", {
            oninput: function (e) { d[key] = e.target.value; scheduleSave(); }
          });
          ta.value = d[key] || "";
          card.appendChild(el("div", { class: "field" }, [el("label", { text: label }), ta]));
        });
        card.appendChild(renderResources(d, course + "|" + ui.weekIdx + "|" + di));
        grid.appendChild(card);
      });
      panel.appendChild(grid);
    }

    frag.appendChild(panel);
    return frag;
  }

  function resUid() { return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function renderResources(day, key) {
    day.resources = day.resources || [];
    var wrap = el("div", { class: "field resources-block" });
    wrap.appendChild(el("label", { text: "Slides & Resources" }));
    var list = el("ul", { class: "resource-list" });
    if (!day.resources.length) {
      list.appendChild(el("li", { class: "resource-empty", text: "No links added yet." }));
    }
    day.resources.forEach(function (r, ri) {
      var cb = el("input", { type: "checkbox" });
      cb.checked = !!r.done;
      cb.addEventListener("change", function (e) { r.done = e.target.checked; scheduleSave(); render(); });
      var link = el("a", {
        href: r.url || "#", target: "_blank", rel: "noopener noreferrer",
        class: "resource-link" + (r.done ? " done" : ""), text: r.label || r.url || "Untitled"
      });
      var rmBtn = el("button", {
        class: "btn danger", text: "✕", title: "Remove", onclick: function () {
          day.resources.splice(ri, 1); scheduleSave(); render();
        }
      });
      list.appendChild(el("li", { class: "resource-row" }, [cb, link, rmBtn]));
    });
    wrap.appendChild(list);

    if (ui.addingResourceFor === key) {
      var labelI = el("input", { type: "text", placeholder: "Label (e.g. Act I slides)" });
      var urlI = el("input", { type: "text", placeholder: "Link (Drive, Canvas, Slides…)" });
      var addBtn = el("button", {
        class: "btn small", text: "✓ Add", onclick: function () {
          var url = urlI.value.trim();
          if (!url) return;
          if (!/^https?:\/\//i.test(url)) url = "https://" + url;
          day.resources.push({ id: resUid(), label: labelI.value.trim() || url, url: url, done: false });
          ui.addingResourceFor = null;
          scheduleSave(); render();
        }
      });
      var cancelBtn = el("button", {
        class: "btn small secondary", text: "Cancel", onclick: function () { ui.addingResourceFor = null; render(); }
      });
      wrap.appendChild(el("div", { class: "resource-add-row" }, [labelI, urlI, el("div", { style: "display:flex;gap:6px;" }, [addBtn, cancelBtn])]));
    } else {
      wrap.appendChild(el("button", {
        class: "btn secondary small", text: "+ Add link", onclick: function () { ui.addingResourceFor = key; render(); }
      }));
    }
    return wrap;
  }

  // ---------- boot ----------
  render();
